
name: Build KACIMI NEJMA VIP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q KACIMI_NEJMA_VIP_project_v1.zip -d project

      - name: Build APK
        run: |
          DIR=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          test -n "$DIR"
          gradle -p "$(dirname "$DIR")" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KACIMI-NEJMA-VIP-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
